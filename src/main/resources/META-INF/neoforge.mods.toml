modId="dchem"
version="1.2.1"
displayName="Destroy Chemistry Addon"
# The URL for your source repository.
displayURL="https://github.com/mogutofu/Destroy-Chemistry-Addon"
issueTrackerURL="https://github.com/mogutofu/Destroy-Chemistry-Addon/issues"
# Local/backup mirror of the source (nginx on the server): http://t12.sjcmc.cn:35765/
description='''Destroy (NHblock714 fork 1.21.1) chemistry addon:
- 1 Na+ + 1 Cl- (brine) -> northstar:salt, cobblestone-catalyzed, needs heat
- Carbonate chemistry: carbonate/bicarbonate/carbonic acid + precipitations + salts
- Meat hydrolysis: pork/beef + (distilled) water -> rotten flesh + glycerol
Gameplay runs server-side via Destroy's datapack chemistry system. Installing the jar on
the client adds JEI display, tooltips and Chinese names for the new molecules/reactions.'''
authors="dchem"

